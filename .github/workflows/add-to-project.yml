name: Add to project board

# Auto-adds new issues and PRs to the repo's GitHub Project (v2) board:
# https://github.com/users/nerdmonkey/projects/3
#
# Requires repo secret MICROWEAVER: a PAT (classic) with `repo` + `project`
# scopes — the default GITHUB_TOKEN can't write to user/org-level Projects v2.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/nerdmonkey/projects/3
          github-token: ${{ secrets.MICROWEAVER }}
