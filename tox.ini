[tox]
envlist = lint, format, test
skipsdist = true

[testenv]
allowlist_externals = poetry
skip_install = true

[testenv:test]
description = Run unit tests with coverage
deps =
    pytest
    pytest-mock
    pytest-asyncio
    pytest-cov
    typer
    pyserial
    esptool
commands =
    pytest --cov=app --cov=config --cov-report=term-missing --cov-fail-under=80

[testenv:lint]
description = Check style and static analysis (flake8 + bandit)
deps =
    flake8
    bandit
commands =
    flake8 .
    bandit -q -r . -x ./tests,./dist,./backup,./.venv,./.tox

[testenv:format]
description = Check formatting without modifying files (black + isort)
deps =
    black
    isort
commands =
    black --check --diff .
    isort --check-only --diff .

[testenv:fix]
description = Auto-fix formatting and unused imports (black + isort + autoflake8)
deps =
    black
    isort
    autoflake8
commands =
    autoflake8 --in-place --recursive --remove-unused-variables .
    isort .
    black .
